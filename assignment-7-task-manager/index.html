<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Figtree:ital,wght@0,300..900;1,300..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="icon" type="image/png" href="./assets/person.png" />

    <script src="index.js"></script>
  </head>
  <body>
    <main class="flex flex-col gap-10">
      <section id="stats">
        <div class="grid grid-cols-4 gap-5">
          <div id="stat-pending" class="border rounded-2xl flex flex-col justify-center items-center p-5">
            <h4 id="pending" class="text-3xl">0</h4>
            <h6>Pending</h6>
          </div>

          <div id="stat-complete" class="border rounded-2xl flex flex-col justify-center items-center p-5">
            <h4 id="completed" class="text-3xl">0</h4>
            <h6>Completed</h6>
          </div>

          <div id="stat-infeasible" class="border rounded-2xl flex flex-col justify-center items-center p-5">
            <h4 id="infeasible" class="text-3xl">0</h4>
            <h6>Infeasible</h6>
          </div>

          <div id="stat-cancel" class="border rounded-2xl flex flex-col justify-center items-center p-5">
            <h4 id="cancel" class="text-3xl">0</h4>
            <h6>Cancelled</h6>
          </div>
        </div>
      </section>

      <section id="create" class="border rounded-2xl p-5">
        <h3 class="text-4xl pb-5">Create Task</h3>
        <form action="">
          <label for="task-name">Task Name: </label>
          <input type="text" id="task-name" placeholder="Enter Task Name" />
          <br />
          <label for="task-category">Category: </label>
          <select id="task-category">
            <option value="" selected diabled>Select Category</option>
            <option value="study">Study</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
          </select>
          <br />
          <label for="task-status">Status: </label>
          <select id="task-status">
            <option value="" selected disabled>Select Current Status</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
            <option value="infeasible">Infeasible</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <br />
          <button type="submit">Create Task</button>
        </form>
      </section>

      <section id="all-tasks" class="border rounded-2xl p-5">
        <h3 class="text-4xl pb-4">All Tasks</h3>
        <table class="w-full table-fixed border-collapse text-left">
          <thead>
            <tr class="divide-x [&>*]:px-5 [&>*]:py-3 border-b">
              <th>Task ID</th>
              <th>Task Name</th>
              <th>Task Category</th>
              <th>Task Status</th>
              <th>Edit Task</th>
              <th>Delete Task</th>
            </tr>
          </thead>
          <tbody id="task-list" class="divide-y">
            <tr class="divide-x [&>*]:px-5 [&>*]:py-3">
              <td>1</td>
              <td>Learn Dom</td>
              <td>Study</td>
              <td>Pending</td>
              <td><button>Edit</button></td>
              <td><button>Delete</button></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
