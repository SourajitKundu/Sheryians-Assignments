<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style.css" />

    <title>Deepstyle</title>

    <link rel="icon" type="image/png" href="./assets/sunflower.png" />
  </head>
  <body class="flex flex-col gap-10">
    <header class="">
      <section class="grid grid-cols-[1fr_5fr_1fr] h-28 w-4/5 mx-auto items-center gap-12 border-b border-gray-400">
        <h1 class="font-semibold text-3xl">Deep*style</h1>
        <nav>
          <ul class="flex gap-12 font-medium justify-center">
            <li>New Arrivals</li>
            <li>Shop</li>
            <li>Beauty</li>
            <li>Sale</li>
            <li>Journal</li>
          </ul>
        </nav>
        <div class="flex justify-end items-center gap-10">
          <i class="fa-solid fa-magnifying-glass"></i>
          <i class="fa-regular fa-user"></i>
          <i class="fa-solid fa-cart-arrow-down text-white p-4 bg-black rounded-full -ml-4"></i>
        </div>
      </section>
    </header>

    <main class="w-4/5 mx-auto flex flex-col gap-2">
      <section>
        <div class="flex justify-between gap-5">
          <img src="./assets/sunflower.png" alt="" class="w-16 h-16" />
          <h1 class="text-6xl font-bold text-center">
            Make Your Fashion Look<br />
            More Charming
          </h1>
          <img src="./assets/red-flower.png" alt="" class="w-16 h-16" />
        </div>
      </section>

      <section class="-mb-12 -mt-3 flex justify-between items-center">
        <div>
          <h6 class="text-xs font-semibold pb-3">Summer Collection</h6>
          <h4 class="text-lg font-medium">
            TRANDY AND<br />
            CLUSSI FOR<br />
            NEW SEASSON
          </h4>
        </div>
        <img src="./assets/round-text.png" alt="" class="-mb-6" />
      </section>

      <section>
        <div class="bento h-[600px] grid grid-cols-5 grid-rows-11 gap-7">
          <img src="./assets/image-1.jpg" alt="1" class="col-start-1 row-start-3 row-end-10" />
          <img src="./assets/image-2.jpg" alt="2" class="col-start-2 row-start-2 row-end-6" />
          <img src="./assets/image-3.jpg" alt="3" class="col-start-2 row-start-6 row-end-11" />
          <img src="./assets/image-4.jpg" alt="4" class="col-start-3 row-start-1 row-end-[-1]" />
          <img src="./assets/image-5.jpg" alt="5" class="col-start-4 row-start-2 row-end-7" />
          <img src="./assets/image-6.jpg" alt="6" class="col-start-4 row-start-7 row-end-11" />
          <img src="./assets/image-7.jpg" alt="7" class="col-start-5 row-start-3 row-end-10" />
          <h4 class="text-lg font-semibold text-center col-start-5 row-start-10 -mt-3">#2022</h4>
        </div>
      </section>

      <section class="-mb-12 -mt-16 flex justify-between items-center">
        <div>
          <i class="bi bi-quote text-5xl"></i>
          <h6 class="text-sm font-semibold pb-3">
            I'm very much of the 'buy less but buy<br />
            better' philosophy. It's what I've never really knew
          </h6>
        </div>
        <div class="flex gap-5 items-center">
          <h1 class="text-6xl font-light">01</h1>
          <h4 class="text-lg font-medium">
            Always be strong<br />
            and have valus
          </h4>
          <i class="bi bi-arrow-right text-white bg-black py-4 px-5 rounded-full"></i>
        </div>
      </section>
    </main>
  </body>
</html>
